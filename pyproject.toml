[project]
name = "cursor-computer-use"
version = "0.1.0"
description = "MCP server that gives any vision model in Cursor (e.g. Grok) Claude-style computer use on macOS"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.10",
    "pillow>=10.1",
    "pyobjc-framework-Quartz>=10",
    "pyobjc-framework-ApplicationServices>=10",
    "pyobjc-framework-Cocoa>=10",
    "pyobjc-framework-Vision>=10",
]

[project.scripts]
cursor-computer-use = "cu_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cu_mcp"]
